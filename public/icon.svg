<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#grad1)" />

  <!-- Lanyard clip slot -->
  <rect x="216" y="56" width="80" height="20" rx="10" fill="#ffffff" opacity="0.3" />

  <!-- Card Body with shadow -->
  <rect x="96" y="96" width="320" height="340" rx="28" fill="#ffffff" filter="url(#shadow)" />

  <!-- Card Top Banner -->
  <path d="M 96,124 Q 96,96 124,96 L 388,96 Q 416,96 416,124 L 416,150 L 96,150 Z" fill="#4f46e5" />
  
  <!-- Lanyard hole -->
  <rect x="226" y="112" width="60" height="14" rx="7" fill="#ffffff" />

  <!-- Avatar Circle -->
  <circle cx="256" cy="210" r="42" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4" />
  <circle cx="256" cy="198" r="16" fill="#4f46e5" />
  <path d="M 230,238 C 230,222 242,216 256,216 C 270,216 282,222 282,238 Z" fill="#4f46e5" />

  <!-- Text lines (badge details) -->
  <rect x="176" y="270" width="160" height="14" rx="7" fill="#1e293b" />
  <rect x="206" y="294" width="100" height="10" rx="5" fill="#64748b" />

  <!-- Mini QR & Barcode -->
  <g transform="translate(160, 324)">
    <rect x="0" y="0" width="46" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- QR Corner squares -->
    <rect x="6" y="6" width="12" height="12" fill="#0f172a" />
    <rect x="28" y="6" width="12" height="12" fill="#0f172a" />
    <rect x="6" y="28" width="12" height="12" fill="#0f172a" />
    <rect x="28" y="28" width="12" height="12" fill="#10b981" />
  </g>

  <!-- Barcode preview lines -->
  <g transform="translate(224, 332)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#0f172a" stroke-width="4"/>
    <line x1="8" y1="0" x2="8" y2="30" stroke="#0f172a" stroke-width="2"/>
    <line x1="14" y1="0" x2="14" y2="30" stroke="#0f172a" stroke-width="6"/>
    <line x1="24" y1="0" x2="24" y2="30" stroke="#0f172a" stroke-width="3"/>
    <line x1="32" y1="0" x2="32" y2="30" stroke="#0f172a" stroke-width="5"/>
    <line x1="42" y1="0" x2="42" y2="30" stroke="#0f172a" stroke-width="2"/>
    <line x1="50" y1="0" x2="50" y2="30" stroke="#0f172a" stroke-width="4"/>
    <line x1="60" y1="0" x2="60" y2="30" stroke="#0f172a" stroke-width="6"/>
    <line x1="72" y1="0" x2="72" y2="30" stroke="#0f172a" stroke-width="3"/>
    <line x1="82" y1="0" x2="82" y2="30" stroke="#0f172a" stroke-width="4"/>
  </g>

  <!-- Green Success badge (check-in symbol) -->
  <circle cx="390" cy="400" r="38" fill="#10b981" stroke="#ffffff" stroke-width="6" filter="url(#shadow)" />
  <path d="M 374,400 L 385,411 L 407,388" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
